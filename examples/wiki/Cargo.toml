[package]
name = "wiki"
version.workspace = true
edition.workspace = true

[lib]
name = "wiki"
path = "src/lib.rs"

[[bin]]
name = "wiki"
path = "src/main.rs"

[dependencies]
ferro = { path = "../../ferro" }
clap = { version = "4", features = ["derive", "env"] }
similar = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
