[package]
name = "ferro"
version.workspace = true
edition.workspace = true

[dependencies]
ferro-derive = { path = "../ferro-derive" }
arc-swap = "1"
blake3 = "1"
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
parking_lot = "0.12"
quick_cache = "0.6"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
psm = "0.1.32"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
parking_lot = "0.12"
proptest = "1"
tempfile = "3"
