[package]
name = "notes"
version.workspace = true
edition.workspace = true

[lib]
name = "notes"
path = "src/lib.rs"

[[bin]]
name = "notes"
path = "src/main.rs"

[[bin]]
name = "notes-scale"
path = "src/bin/scale.rs"

[dependencies]
ferro = { path = "../../ferro" }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
