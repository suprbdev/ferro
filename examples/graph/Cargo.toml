[package]
name = "graph"
version.workspace = true
edition.workspace = true

[lib]
name = "graph"
path = "src/lib.rs"

[[bin]]
name = "graph"
path = "src/main.rs"

[dependencies]
ferro = { path = "../../ferro" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
