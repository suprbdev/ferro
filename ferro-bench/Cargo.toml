[package]
name = "ferro-bench"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ferro-bench"
path = "src/main.rs"

[[bin]]
name = "reclaim"
path = "src/bin/reclaim.rs"

[[bin]]
name = "group"
path = "src/bin/group.rs"

[[bin]]
name = "watchers"
path = "src/bin/watchers.rs"

[[bin]]
name = "clone"
path = "src/bin/clone.rs"

[[bin]]
name = "tables"
path = "src/bin/tables.rs"

[dependencies]
booking = { path = "../examples/booking" }
fastrand = "2"
ferro = { path = "../ferro" }
ledger = { path = "../examples/ledger" }
libc = "0.2"
metrics = { path = "../examples/metrics" }
tempfile = "3"
wiki = { path = "../examples/wiki" }
