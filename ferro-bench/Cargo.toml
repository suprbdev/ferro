[package]
name = "ferro-bench"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ferro-bench"
path = "src/main.rs"

[[bin]]
name = "reclaim"
path = "src/bin/reclaim.rs"
required-features = ["testing"]

[[bin]]
name = "collections"
path = "src/bin/collections.rs"
required-features = ["testing"]

[[bin]]
name = "delta"
path = "src/bin/delta.rs"
required-features = ["testing"]

[[bin]]
name = "follow"
path = "src/bin/follow.rs"
required-features = ["testing"]

[[bin]]
name = "group"
path = "src/bin/group.rs"

[[bin]]
name = "watchers"
path = "src/bin/watchers.rs"

[[bin]]
name = "clone"
path = "src/bin/clone.rs"

[[bin]]
name = "tables"
path = "src/bin/tables.rs"

[[bin]]
name = "merge"
path = "src/bin/merge.rs"

[[bin]]
name = "bytes"
path = "src/bin/bytes.rs"

[features]
default = ["testing"]
mimalloc = ["dep:mimalloc"]
testing = ["ferro/testing"]

[dependencies]
booking = { path = "../examples/booking" }
fastrand = "2"
ferro = { path = "../ferro" }
ledger = { path = "../examples/ledger" }
libc = "0.2"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
metrics = { path = "../examples/metrics" }
mimalloc = { version = "0.1", default-features = false, optional = true }
tempfile = "3"
wiki = { path = "../examples/wiki" }
