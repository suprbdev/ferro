[package]
name = "queue"
version.workspace = true
edition.workspace = true

[lib]
name = "queue"
path = "src/lib.rs"

[[bin]]
name = "queue"
path = "src/main.rs"

[[bin]]
name = "queue-bench"
path = "src/bin/bench.rs"

[dependencies]
ferro = { path = "../../ferro" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
